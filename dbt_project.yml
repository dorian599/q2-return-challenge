name: q2_return
version: '1.0.0'
config-version: 2
profile: q2_return

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  data_path: 'data'
  q2_start_date: '2026-04-01'
  q3_start_date: '2026-07-01'
  quarter_end_date: '2026-06-30'
  pot_value_divisor: 100

models:
  q2_return:
    bronze:
      +materialized: view
    silver:
      +materialized: view
    gold:
      +materialized: table
